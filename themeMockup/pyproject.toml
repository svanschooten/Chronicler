[project]
name = "chronicler"
version = "1.0.0"
description = "A local-first desktop workspace for organizing, reviewing, and processing conversation transcripts."
requires-python = ">=3.10"
keywords = ["apps", "declarative", "kanban", "drag and drop", "routing", "async"]
authors = [{ name = "Stijn van Schooten", email = "stijn.vanschooten@gmail.com" }]
dependencies = ["flet"]

[dependency-groups]
dev = ["flet-cli", "flet-desktop", "flet-web"]

[tool.flet.gallery]
categories = ["Declarative", "Featured"]
screenshots = ["packages/flet/integration_tests/examples/apps/golden/macos/declarative_trolli/declarative_trolli.png"]

[tool.flet.metadata]
title = "Chronicler"
controls = ["SafeArea", "Column", "Row", "Stack", "AppBar", "NavigationRail", "Draggable", "DragTarget", "TextField", "AlertDialog"]
layout_pattern = "dashboard"
complexity = "advanced"
features = ["drag and drop", "routing", "dialogs", "async", "kanban board"]

[tool.flet]
org = "dev.flet"
company = "Stijn van Schooten"
copyright = "Copyright (C) 2026 by Stijn van Schooten"
