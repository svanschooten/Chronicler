name: Chronicler CI/CD
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout Repository

      - uses: ./.github/actions/setup

      - name: Check Ruff
        run: ruff check chronicler tests

      - name: Check Ruff Format
        run: ruff format --check chronicler tests

      - name: Check Mypy
        run: mypy chronicler tests

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: releases ship for it and the project is developed there.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7
        name: Checkout Repository

      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the tests
        shell: bash
        run: pytest -v -s --junitxml=junit.xml --cov=chronicler --cov-report=xml --cov-report=term --cov-fail-under=80

      - name: Upload Test and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}-python${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml

  runtime-locks:
    name: Runtime Locks Are Current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout Repository

      - uses: actions/setup-python@v7
        name: Setup Python
        with:
          python-version: "3.12"

      # The embedded-runtime build installs exactly these locks, so a pyproject.toml change
      # that is not reflected in them would ship something other than what was reviewed.
      # uv resolves for Windows from Linux, so one runner checks both. See
      # docs/runtime-build.md.
      - name: Check the locks
        run: |
          python -m pip install uv
          python scripts/runtime/locks.py --check
