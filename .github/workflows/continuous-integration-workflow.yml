name: Chronicler CI/CD
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout Repository

      - uses: actions/setup-python@v5
        name: Setup Python
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Create virtualenv and install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/pip install -e .

  quality-control:
    name: Quality Control
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout Repository

      - uses: actions/setup-python@v5
        name: Setup Python
        with:
          python-version: "3.12"

      - name: Restore virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Check Ruff
        run: |
          .venv/bin/ruff check chronicler tests

      - name: Check Mypy
        run: |
          .venv/bin/mypy chronicler tests

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # os: [ ubuntu-latest, macos-latest ]
        python-version: ["3.12"]
        # python-version: [ "3.10", "3.12" ]

    steps:
      - uses: actions/checkout@v4
        name: Checkout Repository

      - uses: actions/setup-python@v5
        name: Setup Python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore virtualenv
        id: restore-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install Dependencies (Fallback)
        if: steps.restore-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/pip install -e .

      - name: Run the tests
        run: |
          .venv/bin/pytest -v -s --junitxml=junit.xml --cov=chronicler --cov-report=xml --cov-report=term --cov-fail-under=78

      - name: Upload Test and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-python${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
