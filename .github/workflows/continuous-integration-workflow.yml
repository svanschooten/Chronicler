name: Chronicler CI/CD
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout Repository

      - uses: ./.github/actions/setup

      - name: Check Ruff
        run: ruff check chronicler tests

      - name: Check Ruff Format
        run: ruff format --check chronicler tests

      - name: Check Mypy
        run: mypy chronicler tests

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: releases ship for it and the project is developed there.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7
        name: Checkout Repository

      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the tests
        shell: bash
        run: pytest -v -s --junitxml=junit.xml --cov=chronicler --cov-report=xml --cov-report=term --cov-fail-under=80

      - name: Upload Test and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}-python${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml

  # The tests job installs no extras, so normalization and transcription code would go
  # untested. This installs the runtime locks the embedded build ships - hash-checked, no
  # resolver - and fails if any test is skipped for a missing extra. Every such skip says
  # "requires the '<extra>' extra" through tests/extras.py, which a test enforces. See
  # docs/runtime-build.md.
  extras:
    name: Tests With Every Extra (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        name: Checkout Repository

      - uses: actions/setup-python@v7
        name: Setup Python
        with:
          python-version: "3.12"

      # sounddevice is a binding: Linux needs PortAudio from the system. The Windows wheel
      # bundles it.
      - name: Install PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      # A fresh environment, as the runtime ships, without what the runner image
      # preinstalls. Later steps find its python first on PATH.
      - name: Create a virtual environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/extras"
          if [ -d "$RUNNER_TEMP/extras/Scripts" ]; then
            echo "$RUNNER_TEMP/extras/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/extras/bin" >> "$GITHUB_PATH"
          fi

      # The test tools go in first, so the locks installed after them win any overlap.
      - name: Install the runtime locks
        shell: bash
        run: |
          locks=scripts/runtime/locks/${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9.1.1,<10" pytest-asyncio "pytest-cov>=7.1.0,<8" "pypdf>=6,<7"
          python -m pip install --require-hashes --no-deps -r "$locks/base.lock" \
            $(for lock in "$locks"/component-*.lock; do printf -- '-r %s ' "$lock"; done)
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run the tests
        shell: bash
        run: |
          python -m pytest -rs --cov=chronicler --cov-report=term | tee pytest.log
          if grep -E "SKIPPED.*requires the '[a-z]+' extra" pytest.log; then
            echo "::error::A test was skipped for a missing extra"
            exit 1
          fi

  # Installing every lock at once hides a component that is missing a dependency of its
  # own, as numpy once reached normalization only through transcription (ticket 067).
  extras-alone:
    name: ${{ matrix.component }} Imports On Its Own
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [transcription, normalization, recording, server]
    steps:
      - uses: actions/checkout@v7
        name: Checkout Repository

      - uses: actions/setup-python@v7
        name: Setup Python
        with:
          python-version: "3.12"

      - name: Install PortAudio
        if: matrix.component == 'recording'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Create a virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/component"
          echo "$RUNNER_TEMP/component/bin" >> "$GITHUB_PATH"

      - name: Install base.lock and this component's lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --no-deps \
            -r scripts/runtime/locks/linux/base.lock \
            -r scripts/runtime/locks/linux/component-${{ matrix.component }}.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Import the component
        run: python scripts/import_component.py ${{ matrix.component }}

  runtime-locks:
    name: Runtime Locks Are Current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout Repository

      - uses: actions/setup-python@v7
        name: Setup Python
        with:
          python-version: "3.12"

      # The embedded-runtime build installs exactly these locks, so a pyproject.toml change
      # that is not reflected in them would ship something other than what was reviewed.
      # uv resolves for Windows from Linux, so one runner checks both. See
      # docs/runtime-build.md.
      - name: Check the locks
        run: |
          python -m pip install uv
          python scripts/runtime/locks.py --check
