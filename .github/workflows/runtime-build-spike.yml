# THROWAWAY - delete before feature/modular-build is merged.
#
# Builds the embedded-runtime (PyApp) executable on Linux and Windows and smoke-tests it
# headlessly, the same way the release workflow's `runtime` job does, but on every push to
# the branch. The Windows job also reports the PE subsystem of both launchers, which decides
# whether a double-click flashes a console. Binaries are uploaded for hands-on testing.
name: Runtime build spike
on:
  push:
    branches:
      - feature/modular-build
  workflow_dispatch:

concurrency:
  group: runtime-build-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            variants: console
            binary: dist/runtime/Chronicler-console
          - os: windows-latest
            platform: windows
            variants: gui console
            binary: dist/runtime/Chronicler-console.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv and Rust
        run: |
          python -m pip install --upgrade pip uv
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install PortAudio (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Build
        run: |
          for variant in ${{ matrix.variants }}; do
            uv run --no-project --python 3.12 --with zstandard python scripts/runtime/build.py --variant "$variant"
          done
          ls -la dist/runtime

      # How much of the slow Windows first launch is antivirus scanning of the ~8,000
      # unpacked files: the same unpack timed with and without a Defender exclusion.
      - name: Diagnose the Windows first launch
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          try { "Defender real-time protection: " + (Get-MpComputerStatus).RealTimeProtectionEnabled } catch { "Defender status unavailable" }
          $exe = "dist\runtime\Chronicler-console.exe"
          function Measure-FirstLaunch($label) {
            & $exe self remove *> $null
            $elapsed = Measure-Command { & $exe --help *> $null }
            "{0}: {1:N1}s" -f $label, $elapsed.TotalSeconds
          }
          Measure-FirstLaunch "first launch, default"
          Measure-FirstLaunch "first launch, default (repeat)"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pyapp"
          Measure-FirstLaunch "first launch, PyApp data excluded from Defender"
          Remove-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pyapp"
          & $exe self remove *> $null

      - name: Smoke test
        run: |
          python scripts/runtime/smoke.py --subsystems dist/runtime
          python scripts/runtime/smoke.py ${{ matrix.binary }}

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: chronicler-runtime-${{ matrix.platform }}
          path: dist/runtime/
