name: Chronicler Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version from tag
        id: resolve
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${RAW_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$RAW_TAG' is not a semver release (expected v1.2.3 or 1.2.3)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from tag $RAW_TAG"

  pack:
    name: Pack on ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: # we could add macos-latest later
          - os: ubuntu-latest
            platform: linux
            sep: ":"
            executable_path: dist/Chronicler
            asset_name: Chronicler
          - os: windows-latest
            platform: windows
            sep: ";"
            executable_path: dist/Chronicler.exe
            asset_name: Chronicler.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Stamp release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i -E "s/^__version__ = \".*\"$/__version__ = \"${VERSION}\"/" chronicler/__init__.py
          grep -qx "__version__ = \"${VERSION}\"" chronicler/__init__.py

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . flet-cli pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller Chronicler.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.executable_path }}

  release:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/*
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
