[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chronicler"
version = "0.1.0a0"
description = "A local-first archive for searchable conversation transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "svanschooten" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "flet>=0.28,<1",
    "httpx>=0.27,<1",
    "platformdirs>=4,<5",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]
server = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
transcription = [
    "faster-whisper>=1.1,<2",
]

[project.scripts]
chronicler = "chronicler.__main__:main"
chronicler-server = "chronicler.__main__:server_main"

[project.urls]
Homepage = "https://github.com/svanschooten/Chronicler"
Repository = "https://github.com/svanschooten/Chronicler"
Issues = "https://github.com/svanschooten/Chronicler/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
