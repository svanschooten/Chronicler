[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chronicler"
version = "0.1.0a0"
description = "A local-first archive for searchable conversation transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "svanschooten" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "flet>=0.86.5,<1",
    "httpx>=0.28.1,<1",
    "platformdirs>=4,<5",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2,<3",
    "aiosqlite>=0.20,<1",
    "PyYAML>=6,<7",
    "alembic>=1.19.1,<2",
]

[project.optional-dependencies]
dev = [
    "build>=1.5.0,<2",
    "pytest>=9.1.1,<10",
    "pytest-asyncio",
    "pytest-cov>=7.1.0,<8",
    "mypy>=2.2.0,<3",
    "ruff>=0.16.3,<1",
    "types-PyYAML",
]
server = [
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
]
transcription = [
    "faster-whisper>=1.1,<2",
]
normalization = [
    "av>=12,<19",
]
llm = [
    "llama-cpp-python>=0.3,<1",
]
recording = [
    "sounddevice>=0.4,<1",
]

[project.scripts]
chronicler = "chronicler.__main__:main"
chronicler-server = "chronicler.__main__:server_main"

[project.urls]
Homepage = "https://github.com/svanschooten/Chronicler"
Repository = "https://github.com/svanschooten/Chronicler"
Issues = "https://github.com/svanschooten/Chronicler/issues"

[tool.hatch.build.targets.wheel]
packages = ["chronicler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
# Alembic-generated migration files use its own script.py.mako boilerplate style
# (Union/Sequence, unsorted imports) - every future `alembic revision --autogenerate`
# produces the same, so excluding rather than hand-fixing each one.
extend-exclude = ["chronicler/migrations/*/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"

# faster-whisper is an optional dependency (the "transcription" extra), imported
# lazily inside transcriber._get_model() - it is intentionally NOT installed in CI.
# Upstream also ships no py.typed marker, so even where it IS installed mypy would
# error with import-untyped. ignore_missing_imports covers both cases.
[[tool.mypy.overrides]]
module = "faster_whisper"
ignore_missing_imports = true

# Optional extras, imported lazily and deliberately not installed in CI. Neither ships a
# py.typed marker, so ignore_missing_imports covers both the absent and present cases.
[[tool.mypy.overrides]]
module = ["llama_cpp", "sounddevice"]
ignore_missing_imports = true
